name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

# README_STATS_PAT enables private repository stats.

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Mahdi-Mnx&show_icons=true&theme=github_dark
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Mahdi-Mnx&layout=compact&theme=github_dark&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_PAT || github.token }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub stats"
          git push
